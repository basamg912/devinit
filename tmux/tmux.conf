# tmux 3.6+: Vim-friendly keys and a colourblind-accessible Light/Dark theme.
set -g prefix C-b
bind C-b send-prefix
set -g mouse on
set -s escape-time 10
set -g focus-events on
set -s default-terminal 'tmux-256color'
set -s set-clipboard external
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys emacs
set -g allow-rename off
set -g automatic-rename on
set -g monitor-activity on
set -g visual-activity off
set -g bell-action none

# Keep default % and " shortcuts, but inherit the current working directory.
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi r send-keys -X rectangle-toggle

# tmux obtains client_theme from iTerm2; detached/unknown clients use Dark.
set -g @cb-foreground '#{?#{==:#{client_theme},light},colour235,colour255}'
set -g @cb-inverse '#{?#{==:#{client_theme},light},colour255,colour235}'
set -g @cb-surface '#{?#{==:#{client_theme},light},#f6f8fa,#161b22}'
set -g @cb-muted '#{?#{==:#{client_theme},light},colour241,colour250}'
set -g @cb-blue '#{?#{==:#{client_theme},light},colour25,colour117}'
set -g @cb-amber '#{?#{==:#{client_theme},light},colour94,colour214}'
set -g @cb-purple '#{?#{==:#{client_theme},light},colour90,colour218}'

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=#{E:@cb-foreground},bg=#{E:@cb-surface}'
set -g status-left-style 'fg=#{E:@cb-blue},bold'
set -g status-left-length 20
set -g status-left ' #{=16:session_name} '
set -g status-right-style 'fg=#{E:@cb-muted}'
set -g status-right-length 36
set -g status-right '#{?client_prefix,[KEY] ,}#{?pane_in_mode,[COPY] ,}#{?window_zoomed_flag,[ZOOM] ,}#{?synchronize-panes,[SYNC] ,}%H:%M '
set -g window-status-format ' #I:#{=18:window_name}#F '
set -g window-status-current-format ' [#I:#{=18:window_name}#F] '
set -g window-status-style 'fg=#{E:@cb-muted},bg=#{E:@cb-surface}'
set -g window-status-current-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-blue},bold'
set -g window-status-activity-style 'fg=#{E:@cb-amber},bold'
set -g window-status-bell-style 'fg=#{E:@cb-purple},bold,underscore'
set -g window-status-separator ''
set -g pane-border-style 'fg=#{E:@cb-muted}'
set -g pane-active-border-style 'fg=#{E:@cb-blue}'
set -g pane-border-indicators both
set -g mode-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-blue},bold'
set -g copy-mode-selection-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-blue},bold'
set -g copy-mode-match-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-purple}'
set -g copy-mode-current-match-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-amber},bold'
set -g copy-mode-mark-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-purple},bold'
set -g message-style 'fg=#{E:@cb-foreground},bg=#{E:@cb-surface}'
set -g message-command-style 'fg=#{E:@cb-foreground},bg=#{E:@cb-surface}'
set -g menu-style 'fg=#{E:@cb-foreground},bg=#{E:@cb-surface}'
set -g menu-selected-style 'fg=#{E:@cb-inverse},bg=#{E:@cb-blue},bold'
set -g menu-border-style 'fg=#{E:@cb-blue}'
set -g popup-style 'fg=#{E:@cb-foreground},bg=#{E:@cb-surface}'
set -g popup-border-style 'fg=#{E:@cb-blue}'
# These colour-only options use the adaptive ANSI slots of the iTerm2 theme.
set -g display-panes-colour colour8
set -g display-panes-active-colour colour4
set -g clock-mode-colour colour4
set -g prompt-cursor-colour colour4

set -g @yank_action 'copy-pipe-and-cancel'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '15'
# Do not automatically run a pre-existing browser save hook without opt-in.
if-shell -F '#{m:*tmux-browser/scripts/save_sessions.sh,#{@resurrect-hook-post-save-all}}' 'set -g @continuum-save-interval 0'
set -g @continuum-restore 'off'
set -g @continuum-boot 'off'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Continuum must load last so its status-line save trigger is retained.
set -g @plugin 'tmux-plugins/tmux-continuum'
run-shell '~/.tmux/plugins/tpm/tpm'
